# Five-task RoboTwin-Clean ablation of robotwin_vlm.yaml.
#
# This standalone config is based on configs/robotwin_vlm.yaml; the loader
# merges command-line overrides over one file and does not resolve YAML defaults.
# Optimization: 100 epochs capped at 150000 optimizer updates.
# Launch topology: 1 node x 4 GPUs = 4 data-parallel ranks.
# Global batch: 4 samples per GPU x 16 accumulation steps x 4 ranks = 256.
# The engine uses cosine scheduling with the warmup and floor configured below.
# Reference checkpoint step: 140000; to resume, pass --resume with an actual
# training-state checkpoint path. This comment does not enable automatic resume.
#
# Each task ships as its own LeRobot v2.1 root under the parent directory, so
# `data.dataset_dirs` *is* the task filter and no `data.task_selection` is used.
# The five requested roots stay listed even when the release has not published
# one yet: a missing folder fails the run instead of silently training on a
# smaller subset.
#
# PATCHWAM_NORM_STATS defaults to None, which fits z-score statistics from the
# selected roots; the normalization method itself is unchanged.
model:
  _target_: patchwam.models.FluxAssetPolicy.from_local_assets
  # Defaults point at the local Fast-WAM/ImageWAM asset checkout and stay
  # overridable through the same environment variables as configs/robotwin_vlm.yaml.
  # The loader consumes the original black-forest-labs single-file/flux2-format
  # weights, so the transformer uses the combined release file and the
  # autoencoder the flux2 `ae.safetensors`, not the diffusers-format copies
  # under `transformer/` and `vae/`.
  transformer_path: ${oc.env:PATCHWAM_TRANSFORMER,/home/chuong/workspace/wam/ImageWAM/checkpoints/flux2/FLUX.2-klein-base-4B/flux-2-klein-base-4b.safetensors}
  autoencoder_path: ${oc.env:PATCHWAM_AUTOENCODER,/home/chuong/workspace/wam/ImageWAM/checkpoints/flux2/FLUX.2-dev/ae.safetensors}
  text_encoder_path: ${oc.env:PATCHWAM_VLM,/data/Pretrained_models/Qwen3-VL-4B-Instruct}
  flux_source: ${oc.env:FLUX2_SRC,/home/chuong/workspace/wam/ImageWAM/third_party/flux2}
  action_dim: ${data.processor.action_output_dim}
  proprio_dim: ${data.processor.proprio_output_dim}
  variant: klein-base-4b
  dtype: bfloat16
  device: cuda
  context_length: 128
  shift: 5.0
  video_weight: 0.5
  action_weight: 1.0
  action_scale: 1.0
  gradient_checkpointing: true
  text_encoder_kind: qwen3_vl
  vl_trainable_adapters: false
data:
  _target_: patchwam.data.EpisodeDataset
  # PATCHWAM_DATA_ROOT names the parent directory holding one LeRobot root per
  # task. Listing the five requested roots is the task filter; a folder the
  # release has not published yet still fails the run instead of silently
  # training on a smaller subset.
  dataset_dirs:
  - ${oc.env:PATCHWAM_DATA_ROOT,/data/RoboTwin/RoboTwin-Clean}/turn_switch
  - ${oc.env:PATCHWAM_DATA_ROOT,/data/RoboTwin/RoboTwin-Clean}/rotate_qrcode
  - ${oc.env:PATCHWAM_DATA_ROOT,/data/RoboTwin/RoboTwin-Clean}/blocks_ranking_size
  - ${oc.env:PATCHWAM_DATA_ROOT,/data/RoboTwin/RoboTwin-Clean}/move_stapler_pad
  - ${oc.env:PATCHWAM_DATA_ROOT,/data/RoboTwin/RoboTwin-Clean}/hanging_mug
  num_frames: 17
  endpoint_frames_only: true
  action_video_freq_ratio: 1
  global_sample_stride: 1
  sample_index_stride: 1
  video_size:
  - 288
  - 256
  concat_multi_camera: robotwin
  robotwin_camera_layout: compact_288x256
  val_set_proportion: 0.01
  is_training_set: true
  # Optional: default None fits z-score statistics from the selected training
  # roots. Set PATCHWAM_NORM_STATS to reuse a prepared statistics file.
  pretrained_norm_stats: ${oc.env:PATCHWAM_NORM_STATS,null}
  # This release ships no non-idle row filter, so rows stay unfiltered by
  # default. An explicit PATCHWAM_NONIDLE_FILTER still applies it.
  nonidle_filter_path: ${oc.env:PATCHWAM_NONIDLE_FILTER,null}
  shape_meta:
    images:
    - key: cam_high
      raw_shape:
      - 3
      - 480
      - 640
      shape:
      - 3
      - 240
      - 320
    - key: cam_left_wrist
      raw_shape:
      - 3
      - 480
      - 640
      shape:
      - 3
      - 240
      - 320
    - key: cam_right_wrist
      raw_shape:
      - 3
      - 480
      - 640
      shape:
      - 3
      - 240
      - 320
    action:
    - key: default
      raw_shape: 14
      shape: 14
    state:
    - key: default
      raw_shape: 14
      shape: 14
  processor:
    _target_: patchwam.data.SampleProcessor
    shape_meta: ${data.shape_meta}
    action_output_dim: 14
    proprio_output_dim: 14
    norm_default_mode: z-score
    use_stepwise_action_norm: false
  video_augmentation:
    _target_: patchwam.data.ClipAugment
    p: 0.5
    augment_types:
    - corrupt_only
    - color_only
    - both
    color_jitter:
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
      hue: 0.03
    gamma:
      range:
      - 0.9
      - 1.1
    gaussian_noise:
      std: 0.01
    random_resized_crop:
      scale:
      - 0.95
      - 1.0
      ratio: preserve
    rotate:
      degrees: 5.0
      fill: mean
  include_vl_inputs: true
training:
  output_dir: runs/robotwin_vlm_5tasks
  epochs: 100
  max_updates: 150000
  batch_size: 4
  accumulation: 16
  learning_rate: 0.0001
  weight_decay: 0.01
  precision: bf16
  workers: 16
  gradient_clip: 1.0
  checkpoint_every: 5000
  log_every: 10
  seed: 42
  betas:
  - 0.9
  - 0.95
  warmup_fraction: 0.05
  minimum_lr_fraction: 0.01
  global_batch_size: 256
